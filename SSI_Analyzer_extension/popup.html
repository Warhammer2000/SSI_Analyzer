<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSI Analyzer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0a66c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span class="title">SSI Analyzer</span>
    </div>

    <!-- Login Form -->
    <div id="login-section" class="section" style="display: none;">
      <p class="subtitle">Sign in to save your SSI data</p>
      <div id="login-error" class="error" style="display: none;"></div>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="login-btn">Sign In</button>
      </form>
    </div>

    <!-- Authenticated View -->
    <div id="auth-section" class="section" style="display: none;">
      <div class="user-info">
        <span class="user-email" id="user-email"></span>
        <button id="logout-btn" class="btn-text">Logout</button>
      </div>

      <div class="actions">
        <button id="capture-btn" class="btn-primary">
          Capture SSI from Current Tab
        </button>
        <a href="https://www.linkedin.com/sales/ssi" target="_blank" class="btn-secondary">
          Open SSI Page
        </a>
      </div>

      <div id="status" class="status" style="display: none;"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
